# slurm resource configuration
executor: slurm
#executor: cluster-generic
#cluster-generic-submit-cmd: "sbatch"

# Resources to use if not otherwise specified    
default-resources:
  - mem_mb=16000
  - runtime=1440
  - cores=24
  - slurm_account=sahlab

jobs: 40
latency-wait: 60 
use-conda: True
conda-prefix: /ref/sahlab/software/miniforge3/envs/smk_envs_prophage_pipeline
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
#restart-times: 1

# Force {threads} for the mmseqs taxonomy rule so its shell `--threads {threads}`
# actually uses the allocated CPUs (the nr prefilter over ~176M sequences is the
# pipeline's slowest step; 2 threads makes it take hours).
set-threads:
    mmseqs_taxonomy_combined: 24
    # Right-size to what the tool actually uses (better backfill under cluster contention):
    # PhiSpy is largely single-threaded; separate_unbinned just splits files. The heavy,
    # genuinely-parallel rules (megahit, binning, genomad, checkm, checkv, gtdbtk, coverm)
    # keep 24 via their own `threads: 24` / the cores=24 default.
    phispy_per_mag: 8
    separate_unbinned: 4

set-resources:
    host_removal:
        mem: 50G
        cpus_per_task: 24
    binning_prep:
        mem: 32G
        cpus_per_task: 24
    megahit:
        mem: 32G
        cpus_per_task: 24
        time: 180 
    genomad:
        mem: 50G
    genomad_per_mag:
        mem: 50G
    genomad_unbinned:
        mem: 50G
    genomad_complete_assembly_ORIGINAL:
        mem: 50G
    checkm:
        mem: 50G
    # NOTE (fork fix): the actual mmseqs taxonomy rule is `mmseqs_taxonomy_combined`
    # (workflow/rules/taxonomy.smk). The two names below do not exist as rules, so the
    # big-mem allocation never applied and the real rule ran with the 16G default and
    # failed to load the nr DB. Allocate the memory to the correct rule name.
    mmseqs_taxonomy_combined:
        mem: 700G
        cpus_per_task: 24
    coverm_mapping:
        mem: 50G
    checkv:
        mem: 50G
    gtdbtk_classify_bins:
        mem: 200G
        cpus_per_task: 24
