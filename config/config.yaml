reads: "reads"
outdir: "out"

# PATCH (fork): when true, skip the built-in fastp/host_removal steps and start at
# assembly on pre-staged {outdir}/{sample}/preprocessing/{sample}_{1,2}_hr.fastq.gz
# (produced by the TransitionByProphageInduction 01_preprocess.sh). Default false =
# unchanged upstream behaviour. Override on the CLI: --config external_preprocessing=true
external_preprocessing: false

# FASTQ naming patterns - set to "auto" to auto-detect common patterns
# (_1/_2, _R1/_R2, .fastq.gz/.fq.gz variants), or specify explicitly like:
# fastq_names_1: "{sample}_R1_001.fastq.gz"
# fastq_names_2: "{sample}_R2_001.fastq.gz"
fastq_names_1: "auto"
fastq_names_2: "auto"
fastp_min_sequence_length: 120 

human_ref: "/ref/sahlab/data/GRCh38.fna.gz"
genomad_database: "/ref/sahlab/data/viral_analysis_DBs/genomad_DBs/genomad_db"
bakta_database: "/ref/sahlab/data/bakta_db"
# cat_database: "/ref/sahlab/data/CAT_prepare_20210107"
mmseqs_database: "/ref/sahlab/data/nr/nr_mmseqs15_DB"
gtdbtk_database: "/ref/sahlab/data/gtdb_release226"
checkv_database: "/ref/sahlab/data/viral_analysis_DBs/checkV_DB/checkv-db-v1.4"
taxonomizr_database: "/ref/sahlab/data/accessionTaxa.sql"

# Taxonomy scope: "prophage_only" (faster, only contigs with prophages) or "all_contigs" (comprehensive)
taxonomy_scope: "prophage_only"

# PATCH (fork): skip the mmseqs-vs-nr host-taxonomy step entirely. Default false = upstream
# behaviour. When true, the mmseqs rules never run and host taxonomy for prophages comes from
# GTDB-Tk only (binned prophages); unbinned prophages stay unclassified. mmseqs-vs-nr is a
# ~9h/run step that resolves ~0 for viral prophage queries. Override on CLI:
#   --config skip_mmseqs_taxonomy=true
skip_mmseqs_taxonomy: false

# Conda environments
conda_envs:
  bakta: "../envs/bakta_env.yaml"
  bbtools: "../envs/bbtools_env.yaml"
  # cat: "../envs/cat_env.yaml"
  mmseqs: "../envs/mmseqs_env.yaml"
  gtdbtk: "../envs/gtdbtk_env.yaml"
  checkm: "../envs/checkm_env.yaml"
  checkv: "../envs/checkv_env.yaml"
  concoct: "../envs/concoct_env.yaml"
  coverm: "../envs/coverm_env.yaml"
  dastool: "../envs/dastool_env.yaml"
  fastp: "../envs/fastp_test.yaml"
  genomad: "../envs/genomad_env.yaml"
  maxbin: "../envs/maxbin_env.yaml"
  megahit: "../envs/megahit_env.yaml"
  metabat: "../envs/metabat_env.yaml"
  minimap: "../envs/minimap_env.yaml"
  phage_all: "../envs/phage_all_env.yaml"
  phispy: "../envs/phispy_env.yaml"
  spades: "../envs/spades_env.yaml"
